name: continuous-upload
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: write
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/sync.yml
    with:
      mode: continuous
      limit: 2
      workers: 2
    secrets: inherit
