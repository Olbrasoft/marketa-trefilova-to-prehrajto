name: prepare-sources
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
permissions:
  contents: write
jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    uses: ./.github/workflows/sync.yml
    with:
      mode: prepare
      limit: 2
    secrets: inherit
